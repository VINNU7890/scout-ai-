services:
  - type: web
    name: scoutai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: SEARCH_PROVIDER
        value: "ddg"
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
