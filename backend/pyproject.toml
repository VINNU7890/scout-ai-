[project]
name = "scoutai-backend"
version = "0.1.0"
description = "ScoutAI - AI Competitor & Market Research Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "duckduckgo-search>=6.0.0",
    "tavily-python>=0.3.0",
    "httpx>=0.27.0",
    "trafilatura>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "reportlab>=4.1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
